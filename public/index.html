<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Juniper Salon · Waitlist openings</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <p class="eyebrow">Juniper Salon</p>
        <h1>Last-minute openings</h1>
        <p class="intro">
          When a client cancels, offer the slot to the waitlist: one person at a
          time, in the order they joined, until someone says yes.
        </p>
      </div>
      <div class="demo-controls">
        <span class="pill" id="clock-pill">Demo clock: 1 minute = 1 second</span>
        <label class="toggle" title="Make the text service fail twice before each message goes through">
          <input type="checkbox" id="flaky" /> Unreliable text service
        </label>
        <button class="ghost" id="reset" type="button">Reset demo</button>
      </div>
    </header>

    <main class="layout">
      <section class="col-staff">
        <form class="card" id="new-opening">
          <h2>New opening</h2>
          <div class="fields">
            <label>Service <select name="service"></select></label>
            <label>Stylist <select name="stylist"></select></label>
            <label>Date <input type="date" name="date" required /></label>
            <label>Time <input type="time" name="time" step="900" required /></label>
          </div>
          <div class="form-foot">
            <button type="submit">Start filling this opening</button>
            <p class="hint" id="rules"></p>
          </div>
          <p class="error" id="form-error" hidden></p>
        </form>

        <div id="openings"></div>

        <div class="split">
          <section class="card">
            <h2>Front desk</h2>
            <ul class="feed" id="frontdesk"></ul>
          </section>
          <section class="card">
            <h2>Waitlist</h2>
            <div id="waitlist"></div>
          </section>
        </div>
      </section>

      <aside class="col-phone">
        <section class="card phone-card">
          <h2>Client phones <span class="muted">(simulated texts)</span></h2>
          <div class="tabs" id="phone-tabs"></div>
          <div class="phone">
            <div class="phone-head" id="phone-head"></div>
            <div class="thread" id="thread"></div>
            <form class="reply" id="reply">
              <button type="button" class="quick" data-quick="YES">YES</button>
              <button type="button" class="quick" data-quick="NO">NO</button>
              <input name="text" placeholder="Type a reply" autocomplete="off" />
              <button type="submit">Send</button>
            </form>
          </div>
          <label class="follow"><input type="checkbox" id="follow" checked /> Jump to whoever gets the latest text</label>
        </section>
      </aside>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
